# CI: checks shared on every PR and push to main.
# macOS runner, because the iOS tests (iosSimulatorArm64Test) and Kotlin/Native for Apple
# targets only build on macOS. Minutes are free for public repositories.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "Package.swift"   # the release bot commit only changes the manifest
      - "README.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The Gradle daemon provisions JDK 21 itself (gradle/gradle-daemon-jvm.properties),
      # but the launcher needs a JDK too: install the same one so it isn't downloaded twice.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Caches Gradle dependencies and the Kotlin/Native toolchain (~/.konan) between runs.
      - uses: gradle/actions/setup-gradle@v5

      # Android host tests + iOS simulator tests.
      - run: ./gradlew allTests

      # Distribution smoke check: the XCFramework builds (SKIE + library evolution)
      # and Package.swift is valid.
      - run: ./gradlew assembleSharedDebugXCFramework
      - run: swift package dump-package --manifest-cache none > /dev/null
