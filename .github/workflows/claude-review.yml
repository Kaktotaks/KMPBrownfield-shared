# Claude review with the `swift-reviewer` subagent (.claude/agents/swift-reviewer.md).
#
# Runs on pull requests only (opened / new commits / reopened) and reviews the
# WHOLE PR diff (base...branch), so the single check always reflects the current
# state of the PR. The review is kept in one PR comment that is updated on every
# run, and a "⛔️ не пушити" verdict fails the check (red).
# Before pushing, run the same agent locally in Claude Code:
#   "Use the swift-reviewer agent to check my changes before push"
#
# One-time setup:
#   Run `claude setup-token` locally and save the token as the repository secret
#   CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and variables → Actions).
#   Using an API key instead? Save it as ANTHROPIC_API_KEY and, in the
#   "Claude review" step, replace the CLAUDE_CODE_OAUTH_TOKEN env line with
#   `ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}` (and its check).

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "README.md"
      - ".claude/agents/**"
      - ".github/workflows/claude-review.yml"

# New commits in the same PR cancel the review of the older ones.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # PRs from forks get no secrets and a read-only token, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # post / update the review comment in the PR
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # full history, so the PR range can be diffed

      - name: Work out the PR range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git merge-base "$PR_BASE" HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Reviewing $BASE..$HEAD_SHA"
          git diff --stat "$BASE" HEAD

      # Claude Code CLI in headless (-p) mode; it loads .claude/agents from the checkout.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE: ${{ steps.range.outputs.base }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is not set"; exit 1
          fi
          PROMPT="Use the swift-reviewer subagent to review the changes in the commit range ${BASE}..${HEAD_SHA}. Give the subagent that exact range and do not review anything outside it. Reply with the subagent's review only, unchanged, with no preamble."
          claude -p "$PROMPT" \
            --max-turns 30 \
            --allowedTools "Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            > claude-review.md
          echo "--- review ---"; cat claude-review.md

      - name: Publish the review in the PR
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s claude-review.md ]; then
            echo "No review was produced — see the Claude review step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MARKER="<!-- claude-review -->"
          {
            echo "$MARKER"
            echo "## 🤖 Claude review — \`${HEAD_SHA::7}\`"
            echo
            cat claude-review.md
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          # One comment per PR, updated on every run.
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            -q ".[] | select(.user.login==\"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

      # The check fails when the reviewer says "do not push".
      - name: Gate on the verdict
        run: |
          VERDICT=$(grep -m1 '^Вердикт:' claude-review.md || true)
          echo "$VERDICT"
          case "$VERDICT" in
            *⛔*) echo "::error::Claude review: $VERDICT"; exit 1 ;;
            *⚠*)  echo "::warning::Claude review: $VERDICT" ;;
            "")   echo "::warning::No verdict line found in the review" ;;
          esac
